name: Keep Render backend alive

# Render's free tier spins a web service down after ~15 minutes with no
# traffic. Pinging /api/health every 10 minutes keeps it warm — the 5-minute
# margin absorbs GitHub Actions' own scheduling jitter (cron runs are
# best-effort, not exact).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://property-survey-backend.onrender.com/api/health)
          echo "Response: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed with status $code"
            exit 1
          fi
